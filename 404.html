<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>404 — Community Watch Network</title>

  <link
    rel="stylesheet"
    href="/assets/css/cwn-design-system.css"
  >

  <style>
    .error-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .error-card {
      width: min(780px, 100%);
    }

    .error-code {
      margin: 0;
      color: var(--cwn-success);
      font-family: var(--cwn-font-mono);
      font-size: clamp(4rem, 18vw, 9rem);
      line-height: 0.9;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }
  </style>
</head>

<body>
  <main class="error-shell">
    <section class="cwn-card cwn-card-elevated error-card">
      <span class="cwn-eyebrow">
        CWN NETWORK // ROUTE ERROR
      </span>

      <p class="error-code">
        404
      </p>

      <h1>
        Page not found.
      </h1>

      <p>
        The requested CWN resource does not exist, has moved, or has
        not been rebuilt yet.
      </p>

      <div class="cwn-alert cwn-alert-warning">
        <div>
          <strong>
            Development note
          </strong>

          <div>
            Some parts of the CWN website are still being migrated
            during Phase 2C.
          </div>
        </div>
      </div>

      <div class="error-actions">
        <a
          class="cwn-button cwn-button-primary"
          href="/"
        >
          Go home
        </a>

        <a
          class="cwn-button cwn-button-secondary"
          href="/search"
        >
          Search CWN
        </a>

        <a
          class="cwn-button cwn-button-secondary"
          href="/status"
        >
          Status
        </a>
      </div>

      <p
        class="cwn-mono cwn-muted"
        style="margin-top: 22px;"
      >
        CWN-HTTP-404
      </p>
    </section>
  </main>
</body>
</html>
