<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>Safety — Community Watch Network</title>

  <link
    rel="stylesheet"
    href="/assets/css/cwn-design-system.css"
  >

  <style>
    .placeholder-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .placeholder-card {
      width: min(760px, 100%);
    }

    .placeholder-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }
  </style>
</head>

<body>
  <main class="placeholder-shell">
    <section class="cwn-card cwn-card-elevated placeholder-card">
      <span class="cwn-eyebrow">
        CWN WEBSITE // PHASE 2C
      </span>

      <h1>
        Safety
      </h1>

      <p>
        This section is currently being rebuilt as part of the new
        Community Watch Network website.
      </p>

      <div class="cwn-alert cwn-alert-info">
        <div>
          <strong>
            Development preview
          </strong>

          <div>
            The full safety section will be introduced during the
            current website rebrand.
          </div>
        </div>
      </div>

      <div class="placeholder-actions">
        <a
          class="cwn-button cwn-button-primary"
          href="/"
        >
          Return home
        </a>

        <a
          class="cwn-button cwn-button-secondary"
          href="/status"
        >
          Platform status
        </a>

        <a
          class="cwn-button cwn-button-secondary"
          href="/transparency"
        >
          Transparency
        </a>
      </div>
    </section>
  </main>
</body>
</html>
